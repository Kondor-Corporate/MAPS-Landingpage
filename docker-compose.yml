services:
  db:
    image: postgres:16-alpine
    container_name: maps-asesores-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: maps_asesores_dev
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d maps_asesores_dev']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
