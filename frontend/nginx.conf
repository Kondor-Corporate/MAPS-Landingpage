map $http_x_forwarded_proto $public_scheme {
  default $scheme;
  https https;
}

server {
  listen 8080;
  server_name _;

  # Oculta la versión exacta. No elimina el header Server.
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  # La API conserva los headers de cache del backend. Este location no declara
  # add_header, así que tampoco recibe la CSP ni el cache del frontend.
  location ^~ /api/ {
    # Multer admite hasta 10 MiB; 1 MiB cubre el overhead multipart.
    client_max_body_size 11m;
    proxy_pass ${BACKEND_ORIGIN};
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $public_scheme;
    proxy_ssl_server_name on;
    proxy_ssl_name $proxy_host;
    proxy_redirect off;
  }

  # Assets con hash de contenido que Vite emite bajo /assets/.
  location ^~ /assets/ {
    try_files $uri @frontend_not_found;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # public/ y demás archivos con nombre estable entre deploys.
  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
    try_files $uri @frontend_not_found;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=86400" always;
  }

  # Destino del fallback SPA (/, /login, etc.). Sin cache agresivo.
  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
  }

  # 404 real de un asset. No cae en index.html ni hereda cache immutable.
  location @frontend_not_found {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    return 404;
  }
}
