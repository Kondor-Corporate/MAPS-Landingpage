# Headers de seguridad del frontend (R4-E).
# Incluir en cada location que también declara add_header: en Nginx 1.27
# un add_header en el hijo deja de heredar los del padre.
#
# Solo Content-Security-Policy-Report-Only. No promover a enforce hasta
# confirmar en staging que no hay violaciones funcionales legítimas.
# HSTS queda fuera a propósito: dominio, balanceador y HTTPS definitivos
# se cierran en R5/R7. No emitir Strict-Transport-Security desde aquí.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com https://basemaps.cartocdn.com https://*.basemaps.cartocdn.com; worker-src 'self' blob:; frame-src 'none'; manifest-src 'self'" always;
