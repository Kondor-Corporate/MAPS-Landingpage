# Promoción y rollback controlados (R6-C3 / R6-C4).
#
# No reemplaza la revisión humana del terraform plan: el operador genera el plan
# localmente, lo valida, lo sube a GCS y recién entonces dispara la fase apply.
# Procedimiento completo: docs/GCP_PRODUCTION_RUNBOOK.md (sección R6-C).
#
# Requiere en GitHub (environment production): revisores, TF_STATE_BUCKET,
# GCP_DEPLOY_WORKLOAD_IDENTITY_PROVIDER, GCP_DEPLOY_SERVICE_ACCOUNT.
# Requiere en GCP: module deploy_identity aplicado.
#
# Solo disponible en main (workflow_dispatch).
#
# Convención de seguridad: ningún input se interpola dentro de `run:`. Todos
# llegan como variables de entorno (bloque env de abajo) y
# scripts/release/validate-workflow-inputs.mjs los valida antes de usarlos.

name: Release promote

on:
  workflow_dispatch:
    inputs:
      git_sha:
        description: SHA de 40 hex del release (debe estar en development)
        required: true
        type: string
      release_build_run_id:
        description: ID de release-build. Vacío solo para rollback al baseline R5.
        required: false
        type: string
      phase:
        description: verify = preflight; apply = ejecutar plan ya revisado; wif-read = lecturas con la identidad de deploy
        required: true
        type: choice
        options:
          - verify
          - apply
          - wif-read
      verify_run_id:
        description: 'apply: run id del verify. wif-read: run id del binding ya subido. No es un apply.'
        required: false
        type: string
      plan_sha256:
        description: 'Fase apply: SHA256 del plan.tfplan subido a GCS'
        required: false
        type: string
      plan_mode:
        description: Modo usado al validar el plan (full, jobs-only, services-only)
        required: false
        type: choice
        options:
          - full
          - jobs-only
          - services-only
        default: full
      operation:
        description: promote = avance; rollback = volver a despliegue registrado
        required: true
        type: choice
        options:
          - promote
          - rollback
        default: promote
      target_deployment_id:
        description: 'Rollback verify: deployment_id del registro GCS (p. ej. 900001 o r5-baseline)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: maps-prod-release
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: true
  TF_DIR: infra/terraform/environments/production
  GCP_PROJECT: maps-prod-landing-page
  GCP_REGION: southamerica-east1
  # Inputs: solo por entorno, nunca con ${{ }} dentro de run:.
  GIT_SHA: ${{ inputs.git_sha }}
  RELEASE_BUILD_RUN_ID: ${{ inputs.release_build_run_id }}
  PHASE: ${{ inputs.phase }}
  OPERATION: ${{ inputs.operation }}
  PLAN_MODE: ${{ inputs.plan_mode }}
  VERIFY_RUN_ID: ${{ inputs.verify_run_id }}
  PLAN_SHA256: ${{ inputs.plan_sha256 }}
  TARGET_DEPLOYMENT_ID: ${{ inputs.target_deployment_id }}

jobs:
  verify-promote:
    name: Verificar promoción
    if: github.ref == 'refs/heads/main' && inputs.phase == 'verify' && inputs.operation == 'promote'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validar inputs
        run: node scripts/release/validate-workflow-inputs.mjs

      - name: Preflight de promoción (descarga manifiesto desde GitHub)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MAPS_PRODUCTION_BASELINE_JSON: ${{ vars.MAPS_PRODUCTION_BASELINE_JSON }}
        run: |
          set -euo pipefail
          node scripts/release/run-promotion-preflight.mjs \
            "$GIT_SHA" \
            "$RELEASE_BUILD_RUN_ID" \
            promotion-bundle

      - name: Publicar bundle de promoción
        uses: actions/upload-artifact@v4
        with:
          name: promotion-bundle
          path: |
            promotion-bundle/release-manifest.json
            promotion-bundle/promotion.auto.tfvars
            promotion-bundle/promotion-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Instrucciones de plan (revisión humana obligatoria)
        run: |
          set -euo pipefail
          echo "::notice::Run id de verify: ${GITHUB_RUN_ID}. Commit de main de este workflow: ${GITHUB_SHA}"
          echo "1) Descargar promotion-bundle de este run y ubicar promotion.auto.tfvars."
          echo "2) Con el checkout de main en ${GITHUB_SHA} (el bind lo exige) y la misma versión de Terraform que .terraform-version:"
          echo "   cd ${TF_DIR} && terraform init -backend-config=\"bucket=\$TF_STATE_BUCKET\""
          echo "   terraform plan -out=plan.tfplan <tfvars existentes> -var-file=<bundle>/promotion.auto.tfvars \$(node ../../../../scripts/release/prepare-promotion-plan.mjs targets --mode=${PLAN_MODE})"
          echo "3) terraform show -json plan.tfplan > plan.json"
          echo "4) node scripts/release/prepare-promotion-plan.mjs bind --plan=plan.tfplan --plan-json=plan.json --report=<bundle>/promotion-report.json --mode=${PLAN_MODE} --verify-run-id=${GITHUB_RUN_ID}"
          echo "5) Subir plan y binding con los comandos gsutil que imprime el paso 4 (create-only)."
          echo "6) Disparar phase=apply con verify_run_id=${GITHUB_RUN_ID}, plan_sha256 y plan_mode=${PLAN_MODE}."
          echo "Sintaxis Bash arriba; en PowerShell (Windows) ver docs/GCP_PRODUCTION_RUNBOOK.md, mismos pasos."
          echo "Si main avanza antes del apply, el apply se rechaza: repetir verify, plan y binding."
          echo "Planes: no publicar en artifacts ni logs; bucket con acceso restringido."

  verify-rollback:
    name: Verificar rollback
    if: github.ref == 'refs/heads/main' && inputs.phase == 'verify' && inputs.operation == 'rollback'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validar inputs
        run: node scripts/release/validate-workflow-inputs.mjs

      - name: Autenticar lectura de registro (GCS)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_DEPLOY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Instalar gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Cargar registro de despliegues desde GCS
        run: |
          set -euo pipefail
          node scripts/release/fetch-deployment-registry.mjs \
            --bucket="${STATE_BUCKET}" \
            --out=deployment-registry.snapshot.json

      - name: Preflight de rollback
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOYMENT_REGISTRY_PATH: deployment-registry.snapshot.json
        run: |
          set -euo pipefail
          node scripts/release/run-rollback-preflight.mjs \
            "$GIT_SHA" \
            "$RELEASE_BUILD_RUN_ID" \
            promotion-bundle \
            --target-deployment-id="$TARGET_DEPLOYMENT_ID"

      - name: Publicar bundle de rollback
        uses: actions/upload-artifact@v4
        with:
          name: promotion-bundle
          path: |
            promotion-bundle/release-manifest.json
            promotion-bundle/promotion.auto.tfvars
            promotion-bundle/promotion-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Instrucciones de plan rollback
        run: |
          set -euo pipefail
          echo "::notice::Run id de verify rollback: ${GITHUB_RUN_ID}. Commit de main de este workflow: ${GITHUB_SHA}"
          echo "Si el preflight falla por migraciones intermedias, el rollback de imágenes no está disponible: recuperación por backup (runbook)."
          echo "Plan: plan_mode=full, mismo procedimiento que la promoción (docs/GCP_PRODUCTION_RUNBOOK.md)."
          echo "El apply ejecuta scripts y Terraform de main (${GITHUB_SHA}), no los del SHA de la app."
          echo "Apply: operation=rollback, plan_mode=full, target_deployment_id=${TARGET_DEPLOYMENT_ID}."

  apply-approved-plan:
    name: Apply plan aprobado
    if: github.ref == 'refs/heads/main' && inputs.phase == 'apply'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      DEPLOY_PROVIDER: ${{ vars.GCP_DEPLOY_WORKLOAD_IDENTITY_PROVIDER }}
      DEPLOY_SA: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Automatización privilegiada: el commit de main que disparó el workflow.
          # El SHA de la aplicación va en el plan, no en este checkout.
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validar inputs
        run: node scripts/release/validate-workflow-inputs.mjs

      - name: Bloquear sin identidad de deploy configurada
        run: |
          set -euo pipefail
          missing=0
          if [ -z "$DEPLOY_PROVIDER" ]; then
            echo "::error::Falta variable GCP_DEPLOY_WORKLOAD_IDENTITY_PROVIDER (environment production)."
            missing=1
          fi
          if [ -z "$DEPLOY_SA" ]; then
            echo "::error::Falta variable GCP_DEPLOY_SERVICE_ACCOUNT."
            missing=1
          fi
          if [ -z "$STATE_BUCKET" ]; then
            echo "::error::Falta variable TF_STATE_BUCKET."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "::error::Apply bloqueado hasta apply de deploy_identity y configuración del environment."
            exit 1
          fi
          case "$DEPLOY_PROVIDER" in
            projects/*/locations/global/workloadIdentityPools/maps-github-deploy/providers/*) ;;
            *)
              echo "::error::GCP_DEPLOY_WORKLOAD_IDENTITY_PROVIDER mal formado o fuera del pool maps-github-deploy."
              exit 1
              ;;
          esac

      - name: Leer versión de Terraform del repositorio
        id: tfversion
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < "${TF_DIR}/.terraform-version")"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::${TF_DIR}/.terraform-version debe ser X.Y.Z exacto (un plan guardado exige la misma versión)."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.tfversion.outputs.version }}
          terraform_wrapper: false

      - name: Verificar que verify_run_id sea una corrida auténtica de verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release/verify-promotion-run.mjs --verify-run-id="$VERIFY_RUN_ID" --automation-sha="$GITHUB_SHA"

      - name: Recuperar bundle del verify (no manifiesto local arbitrario)
        uses: actions/download-artifact@v4
        with:
          name: promotion-bundle
          run-id: ${{ inputs.verify_run_id }}
          github-token: ${{ github.token }}
          path: promotion-bundle

      - name: Revalidar manifiesto según su origen
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source="$(node -pe "JSON.parse(require('fs').readFileSync('promotion-bundle/promotion-report.json','utf8')).manifest_source||'github'")"
          if [ "$source" = "baseline" ]; then
            echo "Baseline R5: sin artifact release-build. Digests tomados del registro con evidencia Cloud Run."
            node -e "
              const r=JSON.parse(require('fs').readFileSync('promotion-bundle/promotion-report.json','utf8'));
              for (const k of ['frontend_image','backend_image','jobs_image']) {
                if (!/@sha256:[0-9a-f]{64}$/i.test(String(r.images?.[k]||''))) {
                  console.error('digest inválido', k);
                  process.exit(1);
                }
              }
            "
          elif [ "$source" = "registry" ]; then
            echo "Manifiesto persistido en el registro de despliegue; el artifact de GitHub puede haber expirado."
            node scripts/release/verify-release-authenticity.mjs \
              promotion-bundle/release-manifest.json \
              "$GIT_SHA"
          else
            node scripts/release/verify-release-authenticity.mjs \
              promotion-bundle/release-manifest.json \
              "$GIT_SHA" \
              --github
          fi

      - name: Autenticar identidad de deploy (no build)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_DEPLOY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Instalar gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Verificar digests en Artifact Registry
        run: |
          set -euo pipefail
          source="$(node -pe "JSON.parse(require('fs').readFileSync('promotion-bundle/promotion-report.json','utf8')).manifest_source||'github'")"
          if [ "$source" = "baseline" ]; then
            node scripts/release/verify-image-refs.mjs promotion-bundle/promotion-report.json
            exit 0
          fi
          node scripts/release/verify-release-authenticity.mjs \
            promotion-bundle/release-manifest.json \
            "$GIT_SHA" \
            --gcp

      # Antes de cualquier cambio: producción está donde el registro la da y el baseline con el
      # que se calcularon las migraciones no está adelantado. Solo lecturas (GCS y Cloud Run).
      - name: Verificar punto de partida (registro de despliegues y Cloud Run)
        run: |
          set -euo pipefail
          node scripts/release/verify-starting-point.mjs \
            --report=promotion-bundle/promotion-report.json \
            --plan-mode="${PLAN_MODE}" \
            --bucket="${STATE_BUCKET}"

      - name: Descargar binding y evidencia de migrate (GCS)
        run: |
          set -euo pipefail
          gcloud storage cp "gs://${STATE_BUCKET}/promotion/plans/${VERIFY_RUN_ID}/${PLAN_MODE}.binding.json" plan.binding.json
          operation="$(node -pe "JSON.parse(require('fs').readFileSync('promotion-bundle/promotion-report.json','utf8')).operation||'forward'")"
          needs="$(node -pe "JSON.parse(require('fs').readFileSync('promotion-bundle/promotion-report.json','utf8')).migration?.requires_jobs_first_apply===true")"
          if [ "$operation" != "rollback" ] && [ "$needs" = "true" ] && [ "$PLAN_MODE" = "services-only" ]; then
            gcloud storage cp "gs://${STATE_BUCKET}/promotion/migrate-done/${VERIFY_RUN_ID}.json" migrate-evidence.json
          fi

      - name: Comprobaciones de fase y binding (apply gate)
        run: |
          set -euo pipefail
          args=(
            --promotion-report=promotion-bundle/promotion-report.json
            --manifest=promotion-bundle/release-manifest.json
            --plan-mode="${PLAN_MODE}"
            --verify-run-id="${VERIFY_RUN_ID}"
            --plan-binding=plan.binding.json
            --require-plan-binding=true
            --plan-sha256="${PLAN_SHA256}"
            --git-sha="${GIT_SHA}"
            --release-build-run-id="${RELEASE_BUILD_RUN_ID}"
            --operation="${OPERATION}"
            --target-deployment-id="${TARGET_DEPLOYMENT_ID}"
            --automation-sha="${GITHUB_SHA}"
          )
          needs="$(node -pe "JSON.parse(require('fs').readFileSync('promotion-bundle/promotion-report.json','utf8')).migration?.requires_jobs_first_apply===true")"
          operation="$(node -pe "JSON.parse(require('fs').readFileSync('promotion-bundle/promotion-report.json','utf8')).operation||'forward'")"
          if [ "$needs" = "true" ] && [ "$PLAN_MODE" = "services-only" ] && [ "$operation" != "rollback" ]; then
            args+=(--migrate-evidence=migrate-evidence.json)
          fi
          node scripts/release/validate-promotion-apply-gate.mjs "${args[@]}"

      - name: Descargar plan aprobado desde GCS
        run: |
          set -euo pipefail
          gcloud storage cp "gs://${STATE_BUCKET}/promotion/plans/${VERIFY_RUN_ID}/${PLAN_MODE}.tfplan" plan.tfplan
          actual="$(sha256sum plan.tfplan | awk '{print $1}')"
          if [ "$actual" != "$PLAN_SHA256" ]; then
            echo "::error::SHA256 del plan no coincide con plan_sha256."
            exit 1
          fi

      # El backend GCS declara solo el prefijo (backend.tf); el bucket se pasa aquí, igual
      # que en el plan del operador. -lockfile=readonly evita que el init cambie los hashes
      # de providers versionados en .terraform.lock.hcl.
      - name: Terraform init (backend GCS explícito)
        run: |
          set -euo pipefail
          terraform -chdir="$TF_DIR" init -input=false -lockfile=readonly \
            -backend-config="bucket=${STATE_BUCKET}"

      - name: Validar alcance del plan (JSON)
        env:
          TF_VERSION: ${{ steps.tfversion.outputs.version }}
        run: |
          set -euo pipefail
          terraform -chdir="$TF_DIR" show -json "${GITHUB_WORKSPACE}/plan.tfplan" > plan.json
          node scripts/release/validate-terraform-plan.mjs plan.json \
            --mode "$PLAN_MODE" \
            --promotion-report promotion-bundle/promotion-report.json \
            --expect-terraform-version "$TF_VERSION"

      - name: Apply del plan aprobado (no apply suelto)
        id: apply
        run: |
          set -euo pipefail
          set +e
          terraform -chdir="$TF_DIR" apply -input=false -lock-timeout=300s "${GITHUB_WORKSPACE}/plan.tfplan"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::terraform apply falló (código ${status}). Si el motivo es un plan obsoleto (estado cambiado desde el plan), no reintentar: repetir la fase verify, un plan nuevo y un binding nuevo. Revisar el estado de Cloud Run antes de cualquier otra acción."
            exit "$status"
          fi

      - name: Ejecutar maps-prod-migrate y registrar evidencia (jobs-only)
        if: inputs.plan_mode == 'jobs-only'
        run: |
          set -euo pipefail
          operation="$(node -pe "JSON.parse(require('fs').readFileSync('promotion-bundle/promotion-report.json','utf8')).operation||'forward'")"
          if [ "$operation" = "rollback" ]; then
            echo "Rollback: migrate Prisma prohibido."
            exit 0
          fi
          needs="$(node -pe "JSON.parse(require('fs').readFileSync('promotion-bundle/promotion-report.json','utf8')).migration?.requires_jobs_first_apply===true")"
          if [ "$needs" != "true" ]; then
            echo "Sin migraciones nuevas: no se ejecuta maps-prod-migrate."
            exit 0
          fi
          migrate_cmd="gcloud run jobs execute maps-prod-migrate"
          # La guarda va antes de ejecutar, no después: prohíbe bootstrap en el comando.
          node scripts/release/validate-promotion-apply-gate.mjs \
            --promotion-report=promotion-bundle/promotion-report.json \
            --plan-mode=jobs-only \
            --verify-run-id="${VERIFY_RUN_ID}" \
            --git-sha="${GIT_SHA}" \
            --release-build-run-id="${RELEASE_BUILD_RUN_ID}" \
            --automation-sha="${GITHUB_SHA}" \
            --shell-command="${migrate_cmd}"
          exec_name="$(gcloud run jobs execute maps-prod-migrate \
            --project="${GCP_PROJECT}" \
            --region="${GCP_REGION}" \
            --wait \
            --format='value(name)')"
          node scripts/release/record-migrate-evidence.mjs \
            --bucket="${STATE_BUCKET}" \
            --verify-run-id="${VERIFY_RUN_ID}" \
            --git-sha="${GIT_SHA}" \
            --release-build-run-id="${RELEASE_BUILD_RUN_ID}" \
            --automation-sha="${GITHUB_SHA}" \
            --execution-name="${exec_name}"

      - name: Verificación posterior y registro de despliegue
        run: |
          set -euo pipefail
          set +e
          node scripts/release/post-deployment-verify.mjs \
            --report=promotion-bundle/promotion-report.json \
            --plan-mode="${PLAN_MODE}" \
            --out=post-verify.json
          verify_status=$?
          set -e
          if [ "$verify_status" -ne 0 ]; then
            echo "::warning::Verificación posterior incompleta; no declarar éxito operativo."
          fi
          if [ "$PLAN_MODE" = "jobs-only" ]; then
            echo "jobs-only es una fase intermedia: no se registra un despliegue. Siguiente: plan services-only y su apply."
            if [ "$verify_status" -ne 0 ]; then
              exit 1
            fi
            exit 0
          fi
          if [ "$verify_status" -ne 0 ]; then
            outcome=partial
          else
            outcome=succeeded
          fi
          record_args=(
            --bucket="${STATE_BUCKET}"
            --deployment-id="${GITHUB_RUN_ID}"
            --promotion-verify-run-id="${VERIFY_RUN_ID}"
            --apply-run-id="${GITHUB_RUN_ID}"
            --promotion-report=promotion-bundle/promotion-report.json
            --post-verify=post-verify.json
            --manifest=promotion-bundle/release-manifest.json
            --plan-mode="${PLAN_MODE}"
            --outcome="${outcome}"
          )
          if [ -f migrate-evidence.json ]; then
            record_args+=(--migrations-executed=true)
          fi
          set +e
          node scripts/release/record-deployment-outcome.mjs "${record_args[@]}"
          record_status=$?
          set -e
          if [ "$record_status" -ne 0 ]; then
            echo "::error::Apply o verificación ya ocurrieron, pero el registro GCS no se escribió. No es un éxito. Reconciliar: comparar digests de Cloud Run con promotion-report.json y volver a registrar solo con esa evidencia (generation-match 0)."
            exit 1
          fi
          if [ "$verify_status" -ne 0 ]; then
            exit 1
          fi

      - name: Registrar apply fallido
        if: failure() && steps.apply.outcome == 'failure' && inputs.plan_mode != 'jobs-only'
        run: |
          set -euo pipefail
          node scripts/release/record-deployment-outcome.mjs \
            --bucket="${STATE_BUCKET}" \
            --deployment-id="${GITHUB_RUN_ID}" \
            --promotion-verify-run-id="${VERIFY_RUN_ID}" \
            --apply-run-id="${GITHUB_RUN_ID}" \
            --promotion-report=promotion-bundle/promotion-report.json \
            --plan-mode="${PLAN_MODE}" \
            --outcome=failed || echo "::warning::No se pudo registrar el apply fallido; documentarlo a mano."

  wif-read:
    name: Lectura con identidad de deploy
    if: github.ref == 'refs/heads/main' && inputs.phase == 'wif-read'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      DEPLOY_PROVIDER: ${{ vars.GCP_DEPLOY_WORKLOAD_IDENTITY_PROVIDER }}
      DEPLOY_SA: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validar inputs
        run: node scripts/release/validate-workflow-inputs.mjs

      - name: Bloquear sin identidad de deploy configurada
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_PROVIDER" ] || [ -z "$DEPLOY_SA" ] || [ -z "$STATE_BUCKET" ]; then
            echo "::error::Falta la identidad de deploy o TF_STATE_BUCKET."
            exit 1
          fi

      - name: Descargar el manifiesto del release-build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/release/download-release-manifest.mjs \
            "$RELEASE_BUILD_RUN_ID" \
            "$GIT_SHA" \
            release-manifest.json

      - name: Autenticar identidad de deploy
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_DEPLOY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Instalar gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Leer versión de Terraform del repositorio
        id: tfversion
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < "${TF_DIR}/.terraform-version")"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::${TF_DIR}/.terraform-version debe ser X.Y.Z exacto."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.tfversion.outputs.version }}
          terraform_wrapper: false

      - name: Verificar las cuatro imágenes en Artifact Registry
        run: |
          set -euo pipefail
          node scripts/release/verify-release-authenticity.mjs \
            release-manifest.json \
            "$GIT_SHA" \
            --gcp

      - name: Leer el registro de despliegues
        run: |
          set -euo pipefail
          node scripts/release/fetch-deployment-registry.mjs \
            --bucket="${STATE_BUCKET}" \
            --out=deployment-registry.snapshot.json
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const rows = JSON.parse(readFileSync('deployment-registry.snapshot.json', 'utf8'));
            if (!Array.isArray(rows) || rows.length === 0) {
              console.error('registro vacío o inválido');
              process.exit(1);
            }
            if (!rows.some((row) => row.deployment_id === 'r5-baseline' && row.outcome === 'succeeded')) {
              console.error('el registro no tiene r5-baseline succeeded');
              process.exit(1);
            }
            console.log('registro leído: ' + rows.length + ' objetos.');
          "

      - name: Leer los cuatro recursos de Cloud Run
        run: |
          set -euo pipefail
          node scripts/release/verify-starting-point.mjs --live-only

      - name: Leer el binding existente
        run: |
          set -euo pipefail
          gcloud storage cat "gs://${STATE_BUCKET}/promotion/plans/${VERIFY_RUN_ID}/${PLAN_MODE}.binding.json" > plan.binding.json
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const binding = JSON.parse(readFileSync('plan.binding.json', 'utf8'));
            const fail = (message) => { console.error(message); process.exit(1); };
            if (String(binding.verify_run_id) !== process.env.VERIFY_RUN_ID) fail('binding: verify_run_id distinto.');
            if (binding.plan_mode !== process.env.PLAN_MODE) fail('binding: plan_mode distinto.');
            if (binding.git_sha !== process.env.GIT_SHA) fail('binding: git_sha distinto.');
            if (!/^[0-9a-f]{64}$/.test(String(binding.plan_sha256 ?? ''))) fail('binding: plan_sha256 inválido.');
            console.log('binding leído y coherente con los inputs.');
          "

      - name: Terraform init y listado del state
        run: |
          set -euo pipefail
          terraform -chdir="$TF_DIR" init -input=false -lockfile=readonly \
            -backend-config="bucket=${STATE_BUCKET}"
          terraform -chdir="$TF_DIR" state list > "$RUNNER_TEMP/state-addresses.txt"
          while IFS= read -r addr; do
            grep -qx "$addr" "$RUNNER_TEMP/state-addresses.txt"
          done <<'EOF'
          module.runtime_services.google_cloud_run_v2_service.frontend
          module.runtime_services.google_cloud_run_v2_service.backend
          module.runtime_jobs.google_cloud_run_v2_job.migrate
          module.runtime_jobs.google_cloud_run_v2_job.bootstrap
          EOF
