name: CI

on:
  push:
    branches: [main, master, development]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: maps_ci
        ports:
          - 5432:5432
        # Importante: el comando de health debe ir entre comillas; si no, `-U` se parsea como flag de `docker create` (exit 125).
        options: >-
          --health-cmd="pg_isready -U postgres -d maps_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/maps_ci
      JWT_SECRET: ci_jwt_access_secret_minimum_32_chars_long
      REFRESH_SECRET: ci_jwt_refresh_secret_minimum_32_chars_long
      JWT_EXPIRES_IN: 15m
      REFRESH_EXPIRES_IN: 30d
      DEFAULT_PRODUCER_PASSWORD: Ci_DefaultProd_12chars
      FRONTEND_ORIGIN: http://localhost:5173
      STORAGE_PROVIDER: local
      API_PUBLIC_URL: http://localhost:3000
      NOMINATIM_USER_AGENT: MAPS-Asesores-CI/1.0

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend — install
        working-directory: backend
        run: npm ci

      - name: Frontend — install
        working-directory: frontend
        run: npm ci

      - name: Backend — Prisma migrate
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Backend — seed
        working-directory: backend
        run: npx prisma db seed

      - name: Backend — typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Backend — lint
        working-directory: backend
        run: npm run lint

      - name: Backend — build
        working-directory: backend
        run: npm run build

      - name: Backend — test
        working-directory: backend
        run: npm test

      - name: Frontend — typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend — lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend — build
        working-directory: frontend
        run: npm run build
